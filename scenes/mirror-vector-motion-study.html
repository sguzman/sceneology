<!doctype html>

<head>

  <style>
    html,body{margin:0;background:#171424;width:100%;height:100%;overflow:hidden}
    body{display:grid;place-items:center;font-family:Georgia,serif}
    #stage{
      position:relative;
      width:min(100vw, 56.25vh);height:min(100vh, 177.7778vw);aspect-ratio:9/16;overflow:hidden;
      background:
        radial-gradient(circle at 22% 14%,rgba(255,213,167,.28),transparent 28%),
        linear-gradient(180deg,#726b9a 0%,#565477 23%,#36384f 58%,#27293e 100%);
      transform-origin:center;
    }
    svg{display:block;width:100%;height:100%}
    .rig-node{transform-box:fill-box;transform-origin:center}
    .soft{filter:url(#softGlow)}
    .mote{filter:url(#moteGlow)}
    .pixel-grid{
      position:absolute;inset:0;pointer-events:none;opacity:.08;mix-blend-mode:soft-light;
      background-image:
        linear-gradient(rgba(255,255,255,.17) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.12) 1px,transparent 1px);
      background-size:6px 6px;
    }
    .vignette{
      position:absolute;inset:0;pointer-events:none;
      box-shadow:inset 0 0 180px rgba(20,18,35,.48);
    }
  </style>
</head>

<script src="../runtime/timeline-lite.js"></script>
<script>
(() => {
  const rig = document.querySelector("#princess-rig");
  const mirrorMount = document.querySelector("#mirror-reflection");
  const reflection = rig.cloneNode(true);
  reflection.removeAttribute("id");
  reflection.setAttribute("data-reflection-of", "rig:tender-princess-v0");
  reflection.setAttribute("transform", "translate(1040 520) scale(-0.62 0.62)");
  mirrorMount.appendChild(reflection);

  const all = selector => [
    ...rig.querySelectorAll(selector),
    ...reflection.querySelectorAll(selector)
  ];

  const main = selector => rig.querySelector(selector);
  const reflected = selector => reflection.querySelector(selector);

  const tl = sceneTimeline.timeline({ paused: true, defaults: { ease: "power2.inOut" } });
  sceneTimeline.set(all(".head"), { transformOrigin: "50% 74%" });
  sceneTimeline.set(all(".eyes"), { transformOrigin: "50% 50%" });
  sceneTimeline.set(all(".ponytail-base"), { transformOrigin: "79% 22%" });
  sceneTimeline.set(all(".ponytail-mid"), { transformOrigin: "74% 20%" });
  sceneTimeline.set(all(".ponytail-tip"), { transformOrigin: "72% 14%" });
  sceneTimeline.set(all(".ribbon-left"), { transformOrigin: "85% 30%" });
  sceneTimeline.set(all(".ribbon-right"), { transformOrigin: "15% 30%" });
  sceneTimeline.set(all(".skirt"), { transformOrigin: "50% 5%" });
  sceneTimeline.set(all(".skirt-trim"), { transformOrigin: "50% 20%" });
  sceneTimeline.set(all(".torso"), { transformOrigin: "50% 80%" });
  sceneTimeline.set(all(".hand-right"), { transformOrigin: "60% 20%" });
  sceneTimeline.set(all(".forearm-right"), { transformOrigin: "50% 15%" });
  tl.to(all(".torso"), { y: -4, duration: 1.4 }, 0.4)
    .to(all(".torso"), { y: 0, duration: 1.4 }, 1.8)
    .to(all(".torso"), { y: -3, duration: 1.2 }, 4.6)
    .to(all(".torso"), { y: 0, duration: 1.2 }, 5.8);
  tl.to(all(".eyes"), { x: 8, duration: 0.36, ease: "power1.out" }, 1.28)
    .to(all(".brow-left"), { y: -3, rotation: -2, duration: 0.34 }, 1.30)
    .to(all(".brow-right"), { y: -2, rotation: 2, duration: 0.34 }, 1.30)
    .to(all(".head"), { rotation: 2.4, x: 4, duration: 0.72, ease: "power2.out" }, 1.72);
  tl.to(all(".ponytail-base"), { rotation: -4.4, duration: 0.52, ease: "power2.out" }, 1.93)
    .to(all(".ponytail-mid"), { rotation: -7.2, duration: 0.62, ease: "power2.out" }, 2.02)
    .to(all(".ponytail-tip"), { rotation: -9.5, duration: 0.72, ease: "power2.out" }, 2.08)
    .to(all(".ponytail-base"), { rotation: -1.1, duration: 0.72 }, 2.52)
    .to(all(".ponytail-mid"), { rotation: 1.8, duration: 0.82 }, 2.62)
    .to(all(".ponytail-tip"), { rotation: 3.4, duration: 0.94 }, 2.66)
    .to(all(".ponytail-mid"), { rotation: 0, duration: 0.72 }, 3.46)
    .to(all(".ponytail-tip"), { rotation: 0, duration: 0.84 }, 3.58);
  tl.to(all(".forearm-right"), { rotation: -4, x: -4, y: 3, duration: 0.62 }, 2.35)
    .to(all(".hand-right"), { rotation: -8, x: -8, y: 5, duration: 0.55 }, 2.45)
    .to(all(".skirt"), { rotation: -0.8, x: -2, duration: 0.75 }, 2.62)
    .to(all(".skirt-trim"), { rotation: 1.4, duration: 0.72 }, 2.82)
    .to(all(".ribbon-left"), { rotation: 3.8, duration: 0.60 }, 2.70)
    .to(all(".ribbon-right"), { rotation: -3.2, duration: 0.60 }, 2.72)
    .to(all(".skirt-trim"), { rotation: 0, duration: 0.92 }, 3.54)
    .to(all(".ribbon-left"), { rotation: 0, duration: 0.82 }, 3.50)
    .to(all(".ribbon-right"), { rotation: 0, duration: 0.82 }, 3.52);
  const blinkTargets = [
    main(".eyes"),
    reflected(".eyes")
  ];
  tl.to(blinkTargets, { scaleY: 0.08, duration: 0.09, ease: "power1.in" }, 4.54)
    .to(blinkTargets, { scaleY: 1, duration: 0.12, ease: "power1.out" }, 4.63);
  tl.to(".mote-a", { y: -18, x: 6, opacity: 0.25, duration: 2.4, ease: "sine.inOut" }, 1.0)
    .to(".mote-b", { y: 12, x: -7, opacity: 0.35, duration: 2.7, ease: "sine.inOut" }, 1.3)
    .to(".mote-c", { y: -10, x: -4, opacity: 0.25, duration: 2.6, ease: "sine.inOut" }, 1.2);
  tl.to(all(".head"), { rotation: 0, x: 0, duration: 0.85 }, 6.45)
    .to(all(".eyes"), { x: 0, duration: 0.58 }, 6.72)
    .to(all(".brow-left"), { y: 0, rotation: 0, duration: 0.55 }, 6.70)
    .to(all(".brow-right"), { y: 0, rotation: 0, duration: 0.55 }, 6.70)
    .to(all(".forearm-right"), { rotation: 0, x: 0, y: 0, duration: 0.78 }, 6.45)
    .to(all(".hand-right"), { rotation: 0, x: 0, y: 0, duration: 0.72 }, 6.50)
    .to(all(".skirt"), { rotation: 0, x: 0, duration: 0.84 }, 6.42);

  window.sceneologyTimeline = tl;
  tl.repeat(-1).play(0);
})();
</script>
