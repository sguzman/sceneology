for(const[k,v]of[['eye',eye],['right',right],['up',up],['forward',forward]])gl.uniform3fv(PG[k],v);
gl.uniform1f(PG.focal,focal);gl.uniform1f(PG.aspect,aspect);
for(const point of points){
 const [pos,r,color,intensity]=point;
 gl.uniform3fv(PG.center,pos);gl.uniform1f(PG.radius,r);
 gl.uniform3fv(PG.tint,color);gl.uniform1f(PG.strength,intensity);
 gl.drawArrays(gl.TRIANGLES,0,6);
}
gl.depthMask(true);gl.disable(gl.BLEND);gl.enable(gl.DEPTH_TEST);
gl.disableVertexAttribArray(pcGlowAttr);


gl.useProgram(program);gl.bindBuffer(gl.ARRAY_BUFFER,meshBuffer);
for(const [name,index] of [['p',0],['n',3],['c',6]]){
 const loc=gl.getAttribLocation(program,name);
 gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,3,gl.FLOAT,false,36,index*4);
}
}

function draw(now){if(!alive||!stage.isConnected)return;requestAnimationFrame(draw);
if(last===null)last=now;const dt=clamp((now-last)/1000,0,.05);last=now;
if(document.visibilityState==='hidden')return;
if(running){angle=(angle+dt*rpm*Math.PI/30)%(Math.PI*2);elapsed+=dt;}
const scale=Math.min(1.5,window.devicePixelRatio||1),w=Math.max(1,Math.floor(stage.clientWidth*scale)),h=Math.max(1,Math.floor(stage.clientHeight*scale));
if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}
gl.viewport(0,0,w,h);gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.clearColor(.062,.125,.17,1);gl.clearDepth(1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
const target=[0,0,-.48],eye=[dist*Math.sin(az)*Math.cos(elev),dist*Math.sin(elev),-.48-dist*Math.cos(az)*Math.cos(elev)];
const forward=unit(sub(target,eye)),right=unit(cross([0,1,0],forward)),up=unit(cross(forward,right));
gl.useProgram(program);gl.bindBuffer(gl.ARRAY_BUFFER,meshBuffer);
for(const[key,index]of[['p',0],['n',3],['c',6]]){const loc=gl.getAttribLocation(program,key);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,3,gl.FLOAT,false,36,index*4);}
for(const[k,v]of[['eye',eye],['right',right],['up',up],['forward',forward]])gl.uniform3fv(U[k],v);
for(const[k,v]of[['focal',1.68],['aspect',w/h],['fanAngle',angle],['badgeScale',lighting?1:.00001],['uLightOn',lighting?1:0]])gl.uniform1f(U[k],v);
for(let g=0;g<3;g++){gl.uniform1i(U.group,g);gl.drawArrays(gl.TRIANGLES,ranges[g][0],ranges[g][1]);}
const raw=clamp((rpm-160)/460,0,1),blur=running?raw*raw*(3-2*raw):0;
if(blur>0){
 gl.useProgram(blurProgram);gl.bindBuffer(gl.ARRAY_BUFFER,blurBuffer);
 const loc=gl.getAttribLocation(blurProgram,'corner');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,8,0);
 gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.depthMask(false);
 for(const[k,v]of[['eye',eye],['right',right],['up',up],['forward',forward]])gl.uniform3fv(V[k],v);
 gl.uniform3fv(V.center,[0,0,-.891]);
 for(const[k,v]of[['focal',1.68],['aspect',w/h],['strength',blur],['phase',elapsed*(1.1+rpm/1800*1.4)]])gl.uniform1f(V[k],v);
 gl.drawArrays(gl.TRIANGLES,0,6);gl.depthMask(true);gl.disable(gl.BLEND);gl.disableVertexAttribArray(loc);
}
if(lighting)drawPcGlow([[[0,-.110,-.947],.26,[.28,.96,.92],.82]],eye,right,up,forward,1.68,w/h);

hud.textContent=(running?'Fan spinning':'Fan stopped')+' · '+rpm+' RPM · 29 actual fin plates';
}
requestAnimationFrame(draw);
}catch(e){hud.textContent='GPU error: '+String(e?.message||e);}
})();
</script></body></html>
