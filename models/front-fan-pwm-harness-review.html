const FS=`precision mediump float;varying vec3 vN,vC;uniform float uBrightness;
void main(){vec3 n=normalize(vN);float light=.36+.55*max(dot(n,normalize(vec3(-.6,.8,-.5))),0.)+.22*max(dot(n,normalize(vec3(.8,.45,.7))),0.);

function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}

if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(prog));
const at=["aP","aN","aC"].map(n=>gl.getAttribLocation(prog,n)),uni=Object.fromEntries(["uY","uX","uDist","uAspect","uRotor","uMoving","uFocus","uPivot","uBrightness"].map(n=>[n,gl.getUniformLocation(prog,n)]));
const groups=Array.from({length:10},()=>[]);
function rotate([x,y,z],[aa,bb,cc]){const [a,b,c]=[aa,bb,cc].map(v=>v*Math.PI/180);
let Y=y*Math.cos(a)-z*Math.sin(a),Z=y*Math.sin(a)+z*Math.cos(a);y=Y;z=Z;
let X=x*Math.cos(b)+z*Math.sin(b);Z=-x*Math.sin(b)+z*Math.cos(b);x=X;z=Z;

function tri(g,a,b,c,color){const u=b.map((v,i)=>v-a[i]),v=c.map((v,i)=>v-a[i]);
let n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]],len=Math.hypot(...n)||1;
for(const p of [a,b,c])groups[g].push(...p,...n.map(v=>v/len),...color);}
for(const row of MODEL){
 const [type,sx,sy,sz,x,y,z,ax,ay,az,mi,g]=row;
 const color=PACKET.palette[mi],c=[1,3,5].map(i=>parseInt(color.slice(i,i+2),16)/255),world=p=>rotate(p,[ax,ay,az]).map((v,i)=>v+[x,y,z][i]);
 if(type===0){const a=sx/2,b=sy/2,c0=sz/2;
 const v=[[-a,-b,-c0],[a,-b,-c0],[a,b,-c0],[-a,b,-c0],[-a,-b,c0],[a,-b,c0],[a,b,c0],[-a,b,c0]].map(world);
 for(const f of [[0,3,2,1],[4,5,6,7],[0,1,5,4],[3,7,6,2],[1,2,6,5],[0,4,7,3]]){tri(g,v[f[0]],v[f[1]],v[f[2]],c);tri(g,v[f[0]],v[f[2]],v[f[3]],c);}}
 else{
  for(let i=0;i<sz;i++){const a=i*2*Math.PI/sz,b=(i+1)*2*Math.PI/sz;
  const a0=world([sx*Math.cos(a),-sy/2,sx*Math.sin(a)]),a1=world([sx*Math.cos(a),sy/2,sx*Math.sin(a)]);
  const b0=world([sx*Math.cos(b),-sy/2,sx*Math.sin(b)]),b1=world([sx*Math.cos(b),sy/2,sx*Math.sin(b)]);
  tri(g,a0,b0,b1,c);tri(g,a0,b1,a1,c);tri(g,world([0,sy/2,0]),a1,b1,c);tri(g,world([0,-sy/2,0]),b0,a0,c);}
 }
}
const buffers=groups.map(a=>{const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(a),gl.STATIC_DRAW);return {buffer:b,count:a.length/9};});
gl.enable(gl.DEPTH_TEST);gl.disable(gl.CULL_FACE);
const shown=[true,true,true,true,true,true,true,true,false,false];
let yaw=.40,pitch=.27,dist=7.1,focus=[0,2.48,-.9],angle=0,rpm=620,spinning=false,last=null;
function one(g){gl.bindBuffer(gl.ARRAY_BUFFER,buffers[g].buffer);at.forEach((a,i)=>{if(a>=0){gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,3,gl.FLOAT,false,36,i*12);}});
gl.uniform1f(uni.uMoving,(g===2||g===4)?1:0);gl.uniform3fv(uni.uPivot,g===2?[0,2.18,-1.84]:g===4?[0,3.43,-1.84]:[0,0,0]);

gl.drawArrays(gl.TRIANGLES,0,buffers[g].count);}
function draw(){const px=Math.min(2,devicePixelRatio||1),w=Math.max(1,Math.floor(canvas.clientWidth*px)),h=Math.max(1,Math.floor(canvas.clientHeight*px));
if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}gl.viewport(0,0,w,h);
gl.clearColor(.055,.081,.105,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.useProgram(prog);
gl.uniform1f(uni.uY,yaw);gl.uniform1f(uni.uX,pitch);gl.uniform1f(uni.uDist,dist);gl.uniform1f(uni.uAspect,w/h);
gl.uniform1f(uni.uRotor,angle);gl.uniform3fv(uni.uFocus,focus);
for(let i=0;i<shown.length;i++)if(shown[i])one(i);}
const presets={wires:[.47,.22,7.0,[0,2.42,-.50]],board:[-.20,.08,3.9,[0,2.83,.67]],plug:[-.28,.15,2.65,[.10,1.46,.62]],fan:[.32,.12,3.65,[.55,2.6,-1.60]],m2:[-.27,.15,2.35,[-.35,2.69,.56]]};
const viewIds=["focusWires","focusBoard","focusPlug","focusFan","focusM2"];
const viewNames=["wires","board","plug","fan","m2"];
const buttons=viewIds.map(id=>document.getElementById(id));
function setView(which){[yaw,pitch,dist,focus]=presets[which];buttons.forEach((b,i)=>b.classList.toggle("on",viewNames[i]===which));draw();}
buttons.forEach((b,i)=>b.onclick=()=>setView(viewNames[i]));
for(const b of document.querySelectorAll("[data-part]"))b.onclick=()=>{
const v=b.dataset.part,indices=v==="fans"?[1,2,3,4]:v==="board"?[6,7]:v==="frame"?[8,9]:[+v];
const next=!shown[indices[0]];indices.forEach(i=>shown[i]=next);b.classList.toggle("on",next);draw();};
document.getElementById("spin").onclick=()=>{
spinning=!spinning;last=null;const b=document.getElementById("spin");b.classList.toggle("on",spinning);b.textContent=spinning?"Stop":"Spin";draw();};
const slider=document.getElementById("rpm"),output=document.getElementById("rpmOut");
slider.oninput=()=>{rpm=+slider.value;output.textContent=String(rpm);};
let ptr=null;canvas.onpointerdown=e=>{ptr=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId);};
canvas.onpointermove=e=>{if(!ptr)return;yaw+=(e.clientX-ptr[0])*.009;pitch=Math.max(-1.42,Math.min(1.42,pitch+(e.clientY-ptr[1])*.007));ptr=[e.clientX,e.clientY];draw();};
for(const e of ["pointerup","pointercancel","lostpointercapture"])canvas.addEventListener(e,()=>ptr=null);
canvas.addEventListener("wheel",e=>{e.preventDefault();dist=Math.max(1.6,Math.min(16,dist*Math.exp(e.deltaY*.0009)));draw();},{passive:false});

function tick(t){if(last===null)last=t;const dt=Math.max(0,Math.min(.075,(t-last)/1000));last=t;
if(spinning){angle=(angle+dt*rpm/60*Math.PI*2)%(2*Math.PI);draw();}requestAnimationFrame(tick);}
draw();requestAnimationFrame(tick);
status.textContent="571 verified source meshes · 90 wiring meshes · M.2 + DIMM hierarchy corrected";
}
} catch(e) {status.textContent="3D viewer failed: "+(e&&e.message?e.message:String(e));}
