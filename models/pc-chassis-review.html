const stage=document.getElementById("stage"),notice=document.getElementById("notice");

if(!gl){document.getElementById("fail").style.display="block";notice.textContent="No WebGL context";}else{
const vert=`attribute vec3 aPos,aNorm,aCol;uniform float uYaw,uPitch,uAspect,uDistance;

mat3 ry(float a){float c=cos(a),s=sin(a);return mat3(c,0.,-s, 0.,1.,0., s,0.,c);}

gl_FragColor=vec4(vCol*lit+vec3(edge),uOpacity);}`;

const c=[1,3,5].map(i=>parseInt(colorHex.slice(i,i+2),16)/255);

const [x,y,z]=size.map(v=>v/2);

}

}
button("glass",4);button("front",1);button("roof",2);button("shroud",3);
