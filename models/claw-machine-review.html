function rot(v,d){let [x,y,z]=v,[rx,ry,rz]=d.map(q=>q*Math.PI/180);let c=Math.cos(rx),s=Math.sin(rx);[y,z]=[c*y-s*z,s*y+c*z];c=Math.cos(ry);s=Math.sin(ry);[x,z]=[c*x+s*z,-s*x+c*y];c=Math.cos(rz);s=Math.sin(rz);return[c*x-s*y,s*x+c*y,z];}
function emit(tri,col,g){const rgb=[1,3,5].map(i=>parseInt(col.slice(i,i+2),16)/255);for(const t of tri){const n=unit(cross(sub(t[1],t[0]),sub(t[2],t[0])));for(const p of t)batches[g].push(...p,...n,...rgb);}}
function cube(s,t,r,col,g){const[x,y,z]=s.map(v=>v/2),verts=[[-x,-y,-z],[x,-y,-z],[x,y,-z],[-x,y,-z],[-x,-y,z],[x,-y,z],[x,y,z],[-x,y,z]].map(p=>add(rot(p,r),t));emit(faces.map(f=>f.map(i=>verts[i])),col,g);}
function cyl(rad,h,n,t,r,col,g){let tri=[],p=(x,y,z)=>add(rot([x,y,z],r),t);for(let i=0;i<n;i++){const a=2*Math.PI*i/n,b=2*Math.PI*(i+1)/n,A=p(rad*Math.cos(a),-h/2,rad*Math.sin(a)),Q=p(rad*Math.cos(b),-h/2,rad*Math.sin(b)),R=p(rad*Math.cos(b),h/2,rad*Math.sin(b)),D=p(rad*Math.cos(a),h/2,rad*Math.sin(a));tri.push([A,R,Q],[A,D,R],[p(0,h/2,0),R,D],[p(0,-h/2,0),A,Q]);}emit(tri,col,g);}
for(const[k,a,c,g]of MODEL){if(k==='b')cube(...a,c,g);else cyl(...a,c,g);}
let len=batches.reduce((s,b)=>s+b.length,0),bufferData=new Float32Array(len),offset=0,ranges=[];
for(const b of batches){ranges.push([offset/9,b.length/9]);bufferData.set(b,offset);offset+=b.length;}
const VS=`precision highp float;
attribute vec3 p,n,col;uniform vec3 eye,right,up,forward;
uniform float focal,aspect,craneX,craneZ,dropDepth,grip,prizeX,prizeY,prizeZ,doorAngle;
uniform int group;varying vec3 color;varying float light;
vec3 rz(vec3 q,float a){float c=cos(a),s=sin(a);return vec3(c*q.x-s*q.y,s*q.x+c*q.y,q.z);}
vec3 rx(vec3 q,float a){float c=cos(a),s=sin(a);return vec3(q.x,c*q.y-s*q.z,s*q.y+c*q.z);}
void main(){vec3 v=p,N=n;
if(group==3||group==4){
 vec3 hinge=vec3(group==3?-.092:.092,1.47,-.06);
 float a=group==3?.24*grip:-.24*grip;
 v=hinge+rz(v-hinge,a);N=rz(N,a);
}
if(group>=1&&group<=4){v.x+=craneX;v.z+=craneZ;}
if(group>=2&&group<=4)v.y-=dropDepth;
if(group==5){v.x+=prizeX+.38;v.y+=prizeY;v.z+=prizeZ;}
if(group==6){vec3 hinge=vec3(.595,.566,-.894);v=hinge+rx(v-hinge,doorAngle);}
vec3 delta=v-eye;float z=dot(delta,forward);
gl_Position=vec4(dot(delta,right)*focal/aspect,dot(delta,up)*focal,1.002002*z-.2002,z);
color=col;light=.43+.63*max(0.,dot(normalize(N),normalize(vec3(-.55,.86,-.61))));
}`;
const FS=`precision mediump float;varying vec3 color;varying float light;void main(){gl_FragColor=vec4(min(vec3(1.),color*light),1.);}`;
const shader=(kind,s)=>{let h=gl.createShader(kind);gl.shaderSource(h,s);gl.compileShader(h);if(!gl.getShaderParameter(h,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(h));return h;};
const prog=gl.createProgram();gl.attachShader(prog,shader(gl.VERTEX_SHADER,VS));gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,FS));gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);const gpu=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,gpu);gl.bufferData(gl.ARRAY_BUFFER,bufferData,gl.STATIC_DRAW);
for(const [name,index] of [['p',0],['n',3],['col',6]]){const loc=gl.getAttribLocation(prog,name);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,3,gl.FLOAT,false,36,index*4);}
const U={};for(const id of ['eye','right','up','forward','focal','aspect','craneX','craneZ','dropDepth','grip','prizeX','prizeY','prizeZ','doorAngle','group'])U[id]=gl.getUniformLocation(prog,id);
let mode='idle',time=0,x=0,z=0,down=0,grip=0,last=null,az=.55,el=.25,dist=5.20,drag=false,mouse=[0,0],active=true;
const setButton=(id,callback)=>B(id).addEventListener('click',callback);
setButton('play',()=>{if(mode==='round')return;mode='round';time=0;last=null;});
for(const[id,dx,dz]of[['left',-.12,0],['right',.12,0],['back',0,.12],['forward',0,-.12]])setButton(id,()=>{if(mode!=='idle')return;x=clamp(x+dx,-.58,.58);z=clamp(z+dz,-.34,.34);});
setButton('drop',()=>{if(mode!=='idle')return;down=down?.0:.24;});
setButton('grip',()=>{if(mode!=='idle')return;grip=grip?0:1;});
setButton('reset',()=>{mode='idle';time=0;x=0;z=0;down=0;grip=0;last=null;});
setButton('view',()=>{az=.55;el=.25;dist=5.20;});
canvas.onpointerdown=e=>{drag=true;mouse=[e.clientX,e.clientY];canvas.setPointerCapture?.(e.pointerId);};
canvas.onpointerup=canvas.onpointercancel=()=>drag=false;
canvas.onpointermove=e=>{if(!drag)return;az+=(e.clientX-mouse[0])*.008;el=clamp(el+(e.clientY-mouse[1])*.007,-.38,1.15);mouse=[e.clientX,e.clientY];};
canvas.addEventListener('wheel',e=>{e.preventDefault();dist=clamp(dist*Math.exp(e.deltaY*.001),3.2,8);},{passive:false});
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();active=false;status.textContent='GPU context lost. Reopen preview.';});
function draw(now){if(!active||!stage.isConnected)return;requestAnimationFrame(draw);
 if(last===null)last=now;let dt=clamp((now-last)/1000,0,.075);last=now;
 if(document.visibilityState==='hidden')return;
 if(mode==='round'){time=Math.min(8.5,time+dt);if(time>=8.5)mode='won';}
 const pose=miniatureClawPose({mode,time,x,z,down,grip});
 const ratio=Math.min(1.7,window.devicePixelRatio||1),w=Math.max(1,Math.floor(stage.clientWidth*ratio)),h=Math.max(1,Math.floor(stage.clientHeight*ratio));
 if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}
 gl.viewport(0,0,w,h);gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.disable(gl.BLEND);gl.clearColor(.065,.151,.200,1);gl.clearDepth(1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
 const target=[0,1.25,0],eye=[dist*Math.sin(az)*Math.cos(el),1.25+dist*Math.sin(el),-dist*Math.cos(az)*Math.cos(el)],forward=unit(sub(target,eye)),right=unit(cross([0,1,0],forward)),up=unit(cross(forward,right));
 for(const [name,value]of[['eye',eye],['right',right],['up',up],['forward',forward]])gl.uniform3fv(U[name],value);
 for(const [name,value]of[['focal',1.73],['aspect',w/h],['craneX',pose.x],['craneZ',pose.z],['dropDepth',pose.down],['grip',pose.grip],['prizeX',pose.prizeX],['prizeY',pose.prizeY],['prizeZ',pose.prizeZ],['doorAngle',pose.doorAngle]])gl.uniform1f(U[name],value);
 for(let g=0;g<8;g++){gl.uniform1i(U.group,g);gl.drawArrays(gl.TRIANGLES,ranges[g][0],ranges[g][1]);}
 status.textContent=pose.status+' · '+(pose.won?'Collect your lavender prize!':'Drag to orbit · Wheel to zoom');
 B('drop').textContent=down>0?'Raise claw':'Lower claw';B('grip').textContent=grip?'Open grip':'Close grip';
 B('play').disabled=mode==='round';
}
requestAnimationFrame(draw);
}catch(e){status.textContent='GPU preview error: '+String(e?.message||e);}
})();
</script></body></html>
