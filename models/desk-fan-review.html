if(!stage.isConnected)return;
const dt=Math.max(0,Math.min((now-last)/1000,.075));last=now;
if(document.visibilityState!=='hidden'){
if(running)angle=(angle+dt*rpm*2*Math.PI/60)%(2*Math.PI);
if(oscillating)oscTime+=dt;
const yaw=oscillating?34*Math.PI/180*Math.sin(2*Math.PI*oscTime/4.8):0;
const DPR=Math.min(window.devicePixelRatio||1,2),W=Math.round(Math.max(1,stage.clientWidth)*DPR),H=Math.round(Math.max(1,stage.clientHeight)*DPR);
if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H;}
gl.viewport(0,0,W,H);gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.clearDepth(1);gl.clearColor(.09,.14,.165,1);
gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
const target=[0,.96,0],eye=[dist*Math.sin(az)*Math.cos(el),.96+dist*Math.sin(el),-dist*Math.cos(az)*Math.cos(el)];
const forward=normalize(sub(target,eye)),right=normalize(cross([0,1,0],forward)),up=normalize(cross(forward,right));
for(const [k,v] of [['eye',eye],['right',right],['up',up],['forward',forward]])gl.uniform3fv(u[k],v);
gl.uniform1f(u.focal,1.82);gl.uniform1f(u.aspect,W/H);gl.uniform1f(u.spin,-angle);gl.uniform1f(u.yaw,yaw);
for(let i=0;i<3;i++){gl.uniform1i(u.mode,i);gl.drawArrays(gl.TRIANGLES,batch[i].offset,batch[i].count);}
status.textContent=(running?'FAN ON':'FAN OFF')+' · '+rpm+' RPM · '+(oscillating?'Oscillating':'Head centered')+' · Drag to orbit · Scroll to zoom';
}
requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
