const groupVerts=Array.from({length:8},()=>[]);
const rot=([x,y,z],[a,b,c])=>{a*=Math.PI/180;b*=Math.PI/180;c*=Math.PI/180;
let Y=y*Math.cos(a)-z*Math.sin(a),Z=y*Math.sin(a)+z*Math.cos(a);y=Y;z=Z;
let X=x*Math.cos(b)+z*Math.sin(b);Z=-x*Math.sin(b)+z*Math.cos(b);x=X;z=Z;
X=x*Math.cos(c)-y*Math.sin(c);Y=x*Math.sin(c)+y*Math.cos(c);return[X,Y,z];};
function tri(g,a,b,c,col){const d=b.map((v,i)=>v-a[i]),e=c.map((v,i)=>v-a[i]);
let n=[d[1]*e[2]-d[2]*e[1],d[2]*e[0]-d[0]*e[2],d[0]*e[1]-d[1]*e[0]];
const len=Math.hypot(...n)||1;n=n.map(x=>x/len);
for(const p of [a,b,c])groupVerts[g].push(...p,...n,...col);}
for(const p of MODEL){const [kind,sx,sy,sz,x,y,z,ax,ay,az,mat,g]=p,col=PACKET.palette[mat],c=[1,3,5].map(i=>parseInt(col.slice(i,i+2),16)/255);
const w=q=>rot(q,[ax,ay,az]).map((v,i)=>v+[x,y,z][i]);
if(kind===0){const A=sx/2,B=sy/2,C=sz/2,v=[[-A,-B,-C],[A,-B,-C],[A,B,-C],[-A,B,-C],[-A,-B,C],[A,-B,C],[A,B,C],[-A,B,C]].map(w);
for(const f of [[0,3,2,1],[4,5,6,7],[0,1,5,4],[3,7,6,2],[1,2,6,5],[0,4,7,3]]){tri(g,v[f[0]],v[f[1]],v[f[2]],c);tri(g,v[f[0]],v[f[2]],v[f[3]],c);}
}else{for(let i=0;i<sz;i++){const a=i*2*Math.PI/sz,b=(i+1)*2*Math.PI/sz,r=sx,h=sy;
const a0=w([r*Math.cos(a),-h/2,r*Math.sin(a)]),a1=w([r*Math.cos(a),h/2,r*Math.sin(a)]);
const b0=w([r*Math.cos(b),-h/2,r*Math.sin(b)]),b1=w([r*Math.cos(b),h/2,r*Math.sin(b)]);
tri(g,a0,b0,b1,c);tri(g,a0,b1,a1,c);tri(g,w([0,h/2,0]),a1,b1,c);tri(g,w([0,-h/2,0]),b0,a0,c);}}
}
const buffers=groupVerts.map(a=>{const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(a),gl.STATIC_DRAW);return{buffer:b,count:a.length/9};});
const shown=[true,true,true,true,true,true,false,true];let yaw=3.2,pitch=.15,distance=6.25,focus=[0,2.35,-1.94],angle=0,rpm=520,running=false,last=null;
gl.enable(gl.DEPTH_TEST);gl.disable(gl.CULL_FACE);
function renderGroup(g){gl.bindBuffer(gl.ARRAY_BUFFER,buffers[g].buffer);
att.forEach((a,i)=>{if(a>=0){gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,3,gl.FLOAT,false,36,i*12);}});
gl.uniform1f(uni.uRotor,(g===3||g===5)?1:0);gl.uniform3fv(uni.uPivot,g===3?[0,2.18,-1.84]:g===5?[0,3.43,-1.84]:[0,0,0]);
gl.drawArrays(gl.TRIANGLES,0,buffers[g].count);
}
function draw(){const pixel=Math.min(2,window.devicePixelRatio||1),w=Math.max(1,Math.floor(canvas.clientWidth*pixel)),h=Math.max(1,Math.floor(canvas.clientHeight*pixel));
if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}
gl.viewport(0,0,w,h);gl.clearColor(.057,.084,.107,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.useProgram(program);
gl.uniform1f(uni.uYaw,yaw);gl.uniform1f(uni.uPitch,pitch);gl.uniform1f(uni.uDist,distance);
gl.uniform1f(uni.uAspect,w/h);gl.uniform1f(uni.uAngle,angle);gl.uniform3fv(uni.uFocus,focus);
for(let g=0;g<8;g++)if(shown[g])renderGroup(g);
}
const presets={
front:{yaw:3.2,pitch:.15,distance:6.25,focus:[0,2.35,-1.94]},
detail:{yaw:2.42,pitch:.24,distance:2.55,focus:[.62,2.81,-1.98]},
lower:{yaw:2.85,pitch:.24,distance:3.3,focus:[0,.95,-1.95]}
};
function view(key){const a=presets[key];yaw=a.yaw;pitch=a.pitch;distance=a.distance;focus=[...a.focus];
for(const [k,id] of [["front","viewAll"],["detail","viewDetail"],["lower","viewLower"]])document.getElementById(id).classList.toggle("active",k===key);
notice.textContent=key==="lower"?"Lower bay: NO fan installed. Existing PSU shroud prevents the approved fan frame fitting.":"515 verified source meshes · upper two fans carried in original chassis tabs";
draw();}
document.getElementById("viewAll").onclick=()=>view("front");
document.getElementById("viewDetail").onclick=()=>view("detail");
document.getElementById("viewLower").onclick=()=>view("lower");
for(const b of document.querySelectorAll("[data-group]"))b.onclick=()=>{const g=+b.dataset.group;shown[g]=!shown[g];b.classList.toggle("active",shown[g]);draw();};
const hide=document.getElementById("hideFans");
hide.onclick=()=>{const now=shown[2];for(let g=2;g<=5;g++)shown[g]=!now;hide.textContent=now?"Show fans":"Hide fans";hide.classList.toggle("active",now);draw();};
const run=document.getElementById("run"),slider=document.getElementById("rpm"),out=document.getElementById("rpmOut");
run.onclick=()=>{running=!running;run.textContent=running?"Stop":"Spin";run.classList.toggle("active",running);last=null;draw();};
slider.oninput=()=>{rpm=+slider.value;out.textContent=String(rpm);};
let pointer=null;
canvas.onpointerdown=e=>{pointer=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId);};
canvas.onpointermove=e=>{if(!pointer)return;yaw+=(e.clientX-pointer[0])*.009;pitch=Math.max(-1.42,Math.min(1.42,pitch+(e.clientY-pointer[1])*.007));pointer=[e.clientX,e.clientY];draw();};
for(const name of ["pointerup","pointercancel","lostpointercapture"])canvas.addEventListener(name,()=>pointer=null);
canvas.addEventListener("wheel",e=>{e.preventDefault();distance=Math.max(1.7,Math.min(15,distance*Math.exp(e.deltaY*.0009)));draw();},{passive:false});
new ResizeObserver(draw).observe(canvas);
function tick(now){if(last===null)last=now;const dt=Math.max(0,Math.min(.075,(now-last)/1000));last=now;
if(running){angle=(angle+dt*rpm/60*Math.PI*2)%(Math.PI*2);draw();}
requestAnimationFrame(tick);}
view("front");requestAnimationFrame(tick);
}
</script></body></html>
