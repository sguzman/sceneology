const tex=g.createTexture();g.activeTexture(g.TEXTURE0);g.bindTexture(g.TEXTURE_2D,tex);
g.texParameteri(g.TEXTURE_2D,g.TEXTURE_MIN_FILTER,g.LINEAR);g.texParameteri(g.TEXTURE_2D,g.TEXTURE_MAG_FILTER,g.LINEAR);g.texParameteri(g.TEXTURE_2D,g.TEXTURE_WRAP_S,g.CLAMP_TO_EDGE);g.texParameteri(g.TEXTURE_2D,g.TEXTURE_WRAP_T,g.CLAMP_TO_EDGE);
g.pixelStorei(g.UNPACK_FLIP_Y_WEBGL,true);g.uniform1i(u.inkTex,0);
let lines=[""],col=0,queue=[],strike="",hit=0,pos=.38,target=.38,returning=false,returnAt=0,returnFrom=.38;
let az=.47,el=.31,dist=3.55,drag=false,old=[0,0],last=performance.now();
const alphabet="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
function ink(){ctx.clearRect(0,0,512,256);ctx.fillStyle="#342e2c";ctx.font="bold 23px monospace";ctx.textBaseline="alphabetic";
for(let i=0;i<lines.length;i++){const y=224-(lines.length-1-i)*39;if(y>0)ctx.fillText(lines[i],85,y);}
g.activeTexture(g.TEXTURE0);g.bindTexture(g.TEXTURE_2D,tex);g.texImage2D(g.TEXTURE_2D,0,g.RGBA,g.RGBA,g.UNSIGNED_BYTE,page);}
function put(c,now){if(c==="\n"){enter(now);return;}if(col>=26){enter(now);return;}if(!alphabet.includes(c)&&c!==" ")return;
lines[lines.length-1]+=c;col++;target=.38-.029*col;strike=c;hit=now;ink();}
function enter(now){returnFrom=pos;returnAt=now;returning=true;col=0;target=.38;lines.push("");if(lines.length>5)lines.shift();ink();}
function addText(s){queue.push(...String(s).toUpperCase().split("").filter(x=>alphabet.includes(x)||x===" "||x==="\n"));queue=queue.slice(0,180);}
function clear(){lines=[""];col=0;queue=[];strike="";returning=false;pos=.38;target=.38;ink();}
document.querySelector("#type").onclick=()=>addText(document.querySelector("#input").value);
document.querySelector("#sample").onclick=()=>addText("HELLO WORLD\nSCENARIUM");
document.querySelector("#return").onclick=()=>addText("\n");
document.querySelector("#clear").onclick=clear;
document.querySelector("#reset").onclick=()=>{az=.47;el=.31;dist=3.55;};
cv.addEventListener("pointerdown",e=>{cv.focus();drag=true;old=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId);});
cv.addEventListener("pointerup",()=>drag=false);cv.addEventListener("pointercancel",()=>drag=false);
cv.addEventListener("pointermove",e=>{if(!drag)return;az+=(e.clientX-old[0])*.007;el=clamp(el+(e.clientY-old[1])*.006,-.35,1.12);old=[e.clientX,e.clientY];});
cv.addEventListener("wheel",e=>{e.preventDefault();dist=clamp(dist*Math.exp(e.deltaY*.001),2.1,8);},{passive:false});
cv.addEventListener("keydown",e=>{if(e.key==="Enter"){addText("\n");e.preventDefault();}else if(e.key===" "||/^[a-z]$/i.test(e.key)){addText(e.key);e.preventDefault();}});
ink();
function tick(now){if(!stage.isConnected)return;const dt=clamp((now-last)/1000,0,.07);last=now;
if(document.visibilityState!=="hidden"){
const phase=strike?clamp((now-hit)/170,0,1):1,impact=strike?Math.sin(Math.PI*phase):0;
if(strike&&phase>=1)strike="";
if(returning){let f=clamp((now-returnAt)/300,0,1),e=f*f*(3-2*f);pos=returnFrom+(.38-returnFrom)*e;if(f>=1)returning=false;}
else pos+=(target-pos)*Math.min(1,dt*12);
if(!strike&&!returning&&queue.length)put(queue.shift(),now);
const activeKey=strike===" "?36:alphabet.includes(strike)?10+alphabet.indexOf(strike):-1,activeBar=activeKey>=10&&activeKey<36?100+(activeKey-10)%14:-1;
const ratio=Math.min(2,window.devicePixelRatio||1),W=Math.round(Math.max(1,stage.clientWidth)*ratio),H=Math.round(Math.max(1,stage.clientHeight)*ratio);
if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H;}
g.viewport(0,0,W,H);g.enable(g.DEPTH_TEST);g.depthFunc(g.LEQUAL);g.enable(g.BLEND);g.blendFunc(g.SRC_ALPHA,g.ONE_MINUS_SRC_ALPHA);
g.clearDepth(1);g.clearColor(.105,.135,.17,1);g.clear(g.COLOR_BUFFER_BIT|g.DEPTH_BUFFER_BIT);
const center=[0,.68,0],eye=[dist*Math.sin(az)*Math.cos(el),.68+dist*Math.sin(el),-dist*Math.cos(az)*Math.cos(el)],forward=norm(sub(center,eye)),right=norm(cross([0,1,0],forward)),up=norm(cross(forward,right));
for(const [n,v] of [["eye",eye],["right",right],["up",up],["forward",forward]])g.uniform3fv(u[n],v);
g.uniform1f(u.focal,1.8);g.uniform1f(u.aspect,W/H);g.uniform1f(u.carriage,pos);g.uniform1f(u.impact,impact);g.uniform1i(u.activeKey,activeKey);g.uniform1i(u.activeBar,activeBar);
for(const b of batches){g.uniform1i(u.group,b.group);g.uniform1i(u.textured,b.ink?1:0);g.uniform3fv(u.pivot,b.group>=100?PIVOTS[b.group-100]:[0,0,0]);g.drawArrays(g.TRIANGLES,b.start,b.count);}
note.textContent=queue.length?"Typing · "+queue.length+" remaining":"Ready · "+lines.length+" line(s) · "+col+" characters · drag/orbit wheel/zoom";
}requestAnimationFrame(tick);}
requestAnimationFrame(tick);
</script></body></html>
