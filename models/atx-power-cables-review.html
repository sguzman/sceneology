function segmentPose(a,b){
 const v=a.map((x,i)=>b[i]-x),length=Math.hypot(...v);
 if(!(length>1e-6))throw Error("zero length power cable section");
 return {length,
   mid:a.map((x,i)=>(x+b[i])/2),
   rotate_deg:[
    Math.atan2(v[2],Math.hypot(v[0],v[1]))*180/Math.PI,
    0,-Math.atan2(v[0],v[1])*180/Math.PI
   ]
 };
}
function pathLength(pts){return pts.slice(1).reduce((s,p,i)=>s+Math.hypot(...p.map((v,j)=>v-pts[i][j])),0);}
function powerConnectionPlan(){
 return Object.entries(POWER_ROUTES).map(([key,points])=>({
 id:key,...ENDPOINTS[key],lengthSceneUnits:pathLength(points),
 cableOuterRadius:SLEEVE_RADIUS[key],points
 }));
}
