function rot(p,degree){let [x,y,z]=p;let [ax,ay,az]=degree.map(t=>t*Math.PI/180),c=Math.cos(ax),s=Math.sin(ax);[y,z]=[c*y-s*z,s*y+c*z];c=Math.cos(ay);s=Math.sin(ay);[x,z]=[c*x+s*z,-s*x+c*z];c=Math.cos(az);s=Math.sin(az);[x,y]=[c*x-s*y,s*x+c*y];return [x,y,z];}
function emit(faces,color,group){
 const begin=vertices.length/9,rgb=[1,3,5].map(i=>parseInt(color.slice(i,i+2),16)/255);
 for(const face of faces){
 let [a,b,c]=face;const n=unit(cross(sub(b,a),sub(c,a)));
 for(const pt of [a,b,c])vertices.push(...pt,...n,...rgb);
 }
 batches.push({begin,count:vertices.length/9-begin,group});
}
const FACES=[[0,2,1],[0,3,2],[4,5,6],[4,6,7],[0,1,5],[0,5,4],[1,2,6],[1,6,5],[2,3,7],[2,7,6],[3,0,4],[3,4,7]];
function box(size,at,angles,color,group){
 const [w,h,d]=size.map(q=>q/2),raw=[[-w,-h,-d],[w,-h,-d],[w,h,-d],[-w,h,-d],[-w,-h,d],[w,-h,d],[w,h,d],[-w,h,d]];
 const p=raw.map(x=>add(rot(x,angles),at));
 emit(FACES.map(f=>f.map(i=>p[i])),color,group);
}
function cy(rad,height,segments,at,angles,color,group){
const lo=-height/2,hi=height/2,faces=[];
function pt(x,y,z){return add(rot([x,y,z],angles),at)}
for(let i=0;i<segments;i++){
const a=i*Math.PI*2/segments,b=(i+1)*Math.PI*2/segments,xa=rad*Math.cos(a),za=rad*Math.sin(a),xb=rad*Math.cos(b),zb=rad*Math.sin(b);
const A=pt(xa,lo,za),B=pt(xb,lo,zb),C=pt(xb,hi,zb),D=pt(xa,hi,za);
faces.push([A,C,B],[A,D,C],[pt(0,hi,0),C,D],[pt(0,lo,0),A,B]);
}
emit(faces,color,group);
}
function ribbon(points,width,depth,color,group){
const faces=[];
for(let i=1;i<points.length;i++){
const a=points[i-1],b=points[i],dir=unit(sub(b,a));
const guide=Math.abs(dir[1])>.92?[1,0,0]:[0,1,0];
const right=mult(unit(cross(dir,guide)),width/2),front=mult(unit(cross(right,dir)),depth/2);
const v0=[add(add(a,right),front),add(sub(a,right),front),sub(sub(a,right),front),add(sub(a,front),right)];
const v1=[add(add(b,right),front),add(sub(b,right),front),sub(sub(b,right),front),add(sub(b,front),right)];
const v=[...v0,...v1];for(const f of FACES)faces.push(f.map(x=>v[x]));
}
emit(faces,color,group);
}
function loft(sections,color,group){
const faces=[],N=sections[0][1].length;
const p=sections.map(([z,xy])=>xy.map(([x,y])=>[x,y,z]));
for(let i=0;i<p.length-1;i++){
for(let j=0;j<N;j++){
 const k=(j+1)%N;
 faces.push([p[i][j],p[i][k],p[i+1][k]],[p[i][j],p[i+1][k],p[i+1][j]]);
}
}
for(let i=1;i<N-1;i++){faces.push([p[0][0],p[0][i+1],p[0][i]]);faces.push([p.at(-1)[0],p.at(-1)[i],p.at(-1)[i+1]]);}
emit(faces,color,group);
}
function prism(profile,depth,at,angle,color,group){
const faces=[],zlo=-depth/2,zhi=depth/2;
const pt=([x,y],z)=>add(rot([x,y,z],angle),at);
for(let i=0;i<profile.length;i++){
const j=(i+1)%profile.length;
faces.push([pt(profile[i],zlo),pt(profile[j],zlo),pt(profile[j],zhi)],[pt(profile[i],zlo),pt(profile[j],zhi),pt(profile[i],zhi)]);
}
for(let i=1;i<profile.length-1;i++){
faces.push([pt(profile[0],zlo),pt(profile[i+1],zlo),pt(profile[i],zlo)]);
faces.push([pt(profile[0],zhi),pt(profile[i],zhi),pt(profile[i+1],zhi)]);
}
emit(faces,color,group);
}
for(const [k,a,color,group] of MODEL){
 if(k==="b")box(...a,color,group);
 if(k==="c")cy(...a,color,group);
 if(k==="r")ribbon(...a,color,group);
 if(k==="l")loft(...a,color,group);
 if(k==="p")prism(...a,color,group);
}
const vs=[
"#version 300 es","precision highp float;",
"in vec3 pos,norm,col;",
"uniform vec3 eye,camRight,camUp,forward;",
"uniform float focal,aspect,spin,armYaw,armLift,crankAngle;",
"uniform int motion;",
"out vec3 vColor;out float vLight;",
"void main(){",
"vec3 pt=pos;vec3 n=norm;",
"if(motion==1){",
" vec3 rel=pt-vec3(-.385,.570,-.120);",
" pt=vec3(-.385,.570,-.120)+vec3(cos(spin)*rel.x+sin(spin)*rel.z,rel.y,-sin(spin)*rel.x+cos(spin)*rel.z);",
" n=vec3(cos(spin)*n.x+sin(spin)*n.z,n.y,-sin(spin)*n.x+cos(spin)*n.z);",
"}else if(motion==2){",
" vec3 rel=pt-vec3(.31,.605,.30);float a=armYaw,b=armLift;",
" rel=vec3(rel.x,cos(b)*rel.y-sin(b)*rel.z,sin(b)*rel.y+cos(b)*rel.z);",
" n=vec3(n.x,cos(b)*n.y-sin(b)*n.z,sin(b)*n.y+cos(b)*n.z);",
" pt=vec3(.31,.605,.30)+vec3(cos(a)*rel.x+sin(a)*rel.z,rel.y,-sin(a)*rel.x+cos(a)*rel.z);",
" n=vec3(cos(a)*n.x+sin(a)*n.z,n.y,-sin(a)*n.x+cos(a)*n.z);",
"}else if(motion==3){",
" vec3 rel=pt-vec3(.757,.252,.29);float a=crankAngle;",
" pt=vec3(.757,.252,.29)+vec3(rel.x,cos(a)*rel.y-sin(a)*rel.z,sin(a)*rel.y+cos(a)*rel.z);",
" n=vec3(n.x,cos(a)*n.y-sin(a)*n.z,sin(a)*n.y+cos(a)*n.z);",
"}",
"vec3 d=pt-eye;float z=dot(d,forward);",
"gl_Position=vec4(dot(d,camRight)*focal/aspect,dot(d,camUp)*focal,1.002002*z-.1001,z);",
"vColor=col;",
"vLight=.35+.70*max(0.,dot(normalize(n),normalize(vec3(-.55,.8,-.65))));",
"}"
].join("\n");
const fs=["#version 300 es","precision highp float;","in vec3 vColor;in float vLight;out vec4 outColor;",
"void main(){outColor=vec4(min(vec3(1.),vColor*vLight),1.);}"].join("\n");
function shader(type,src){const sh=gl.createShader(type);gl.shaderSource(sh,src);gl.compileShader(sh);if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(sh));return sh;}
let program;
try{program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vs));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));}
catch(e){status.textContent="WebGL2 renderer failed: "+e.message;throw e}
gl.useProgram(program);const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(vertices),gl.STATIC_DRAW);
for(const [name,offset] of [["pos",0],["norm",3],["col",6]]){const loc=gl.getAttribLocation(program,name);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,3,gl.FLOAT,false,36,offset*4);}
const u={};for(const name of ["eye","camRight","camUp","forward","focal","aspect","spin","armYaw","armLift","crankAngle","motion"])u[name]=gl.getUniformLocation(program,name);
let az=.56,el=.27,dist=3.95,playing=false,arm=0,spinning=0,crank=0,windUntil=0,last=performance.now(),drag=false,previous=[0,0];
function setPlayback(value){playing=value;play.textContent=playing?"❚❚ Pause record":"▶ Play record";play.setAttribute("aria-pressed",String(playing));}
play.onclick=()=>setPlayback(!playing);
wind.onclick=()=>windUntil=performance.now()+950;
document.querySelector("#reset").onclick=()=>{az=.56;el=.27;dist=3.95;};
canvas.addEventListener("pointerdown",e=>{drag=true;previous=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener("pointerup",()=>drag=false);
canvas.addEventListener("pointercancel",()=>drag=false);
canvas.addEventListener("pointermove",e=>{if(!drag)return;az+=(e.clientX-previous[0])*.008;el=Math.max(-.7,Math.min(1.1,el+(e.clientY-previous[1])*.007));previous=[e.clientX,e.clientY];});
canvas.addEventListener("wheel",e=>{e.preventDefault();dist=Math.max(2.4,Math.min(8,dist*Math.exp(e.deltaY*.001)));},{passive:false});
function frame(now){
 if(!stage.isConnected)return;
 const dt=Math.min(.075,Math.max(0,(now-last)/1000));last=now;
 if(document.visibilityState!=="hidden"){
 arm+=(Number(playing)-arm)*Math.min(1,dt*2.7);
 if(playing)spinning=(spinning+dt*(2*Math.PI*78/60))%(Math.PI*2);
 if(now<windUntil)crank+=dt*2*Math.PI*3;
 const width=Math.max(1,stage.clientWidth),height=Math.max(1,stage.clientHeight),dpr=Math.min(2,window.devicePixelRatio||1);
 const W=Math.round(width*dpr),H=Math.round(height*dpr);
 if(canvas.width!==W||canvas.height!==H){canvas.width=W;canvas.height=H;}
 gl.viewport(0,0,W,H);gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.clearDepth(1);gl.clearColor(.102,.13,.17,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
 const target=[0,.81,0],eye=[target[0]+dist*Math.sin(az)*Math.cos(el),target[1]+dist*Math.sin(el),target[2]-dist*Math.cos(az)*Math.cos(el)];
 const f=unit(sub(target,eye)),right=unit(cross([0,1,0],f)),up=unit(cross(f,right));
 for(const [name,val] of [["eye",eye],["camRight",right],["camUp",up],["forward",f]])gl.uniform3fv(u[name],val);
 gl.uniform1f(u.focal,1.8);gl.uniform1f(u.aspect,W/H);
 gl.uniform1f(u.spin,spinning);gl.uniform1f(u.armYaw,.48*(1-arm));gl.uniform1f(u.armLift,.19*(1-arm));gl.uniform1f(u.crankAngle,crank);
 for(const batch of batches){gl.uniform1i(u.motion,batch.group);gl.drawArrays(gl.TRIANGLES,batch.begin,batch.count);}
 status.textContent=(playing?"PLAYING · 78 RPM · stylus lowered":"PAUSED · tonearm parked")+" · Drag to orbit · Scroll to zoom";
 }
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
