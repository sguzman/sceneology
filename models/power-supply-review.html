   const shutter=Math.min(.42,(rpm/60)*2*Math.PI/60*.58);
   for(let i=0;i<7;i++)drawGroup(1,spin+(i-3)*shutter/6,1/7+.04);
   gl.depthMask(true);gl.disable(gl.BLEND);
 }
 hud.textContent=MODEL.length+' source meshes · '+buffers.reduce((s,b)=>s+b.count,0).toLocaleString()+' GPU vertices · Fan '+(running?rpm+' RPM':'stopped');
 requestAnimationFrame(render);
}
toggle.addEventListener('click',()=>setRunning(!running));
range.addEventListener('input',()=>{rpm=Number(range.value);out.textContent=rpm;setRunning(rpm>0)});
document.getElementById('modular').addEventListener('click',()=>{yaw=Math.PI;pitch=.22;dist=3.0;});
document.getElementById('rear').addEventListener('click',()=>{yaw=0;pitch=.2;dist=3.0;});
document.getElementById('top').addEventListener('click',()=>{yaw=2.0;pitch=1.14;dist=3.15;});
document.getElementById('reset').addEventListener('click',()=>{yaw=2.48;pitch=.60;dist=3.4;});
let last=null;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);last=[e.clientX,e.clientY]});
canvas.addEventListener('pointermove',e=>{if(!last)return;const [x,y]=last;yaw+=(e.clientX-x)*.009;pitch=Math.max(-1.35,Math.min(1.35,pitch+(e.clientY-y)*.008));last=[e.clientX,e.clientY]});
for(const name of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(name,()=>{last=null});
canvas.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(2.05,Math.min(9,dist*Math.exp(e.deltaY*.0009)))},{passive:false});
requestAnimationFrame(render);
}
