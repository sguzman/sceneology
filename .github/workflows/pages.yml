name: Publish Sceneology website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sceneology-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate gallery, ontology and migration roadmap
        run: node scripts/validate.mjs
      - name: Browser-check curated gallery behavior using synthetic records
        run: node scripts/test-site-gallery.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live website assets and browser gallery
        env:
          SCENEOLOGY_SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/test-live-site.mjs
      - name: Verify real keyboard skip navigation and mobile overflow
        env:
          SCENEOLOGY_SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/test-live-keyboard.mjs
      - name: Verify live approved models and archived source families
        env:
          SCENEOLOGY_SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/test-live-model-collection.mjs
      - name: Verify 30 accepted-source review previews without gallery promotion
        env:
          SCENEOLOGY_SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/test-live-family-review.mjs
      - name: Verify source-only room diagnostics after deployment
        env:
          SCENEOLOGY_SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/test-live-room-diagnostics.mjs
      - name: Verify bed-cover reconstruction comparison after deployment
        env:
          SCENEOLOGY_SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/test-live-blanket-review.mjs
      - name: Verify Quest Girl source-derived functional motion viewer
        env:
          SCENEOLOGY_SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/test-live-quest-girl-motion.mjs
      - name: Exercise all four Quest Girl motions and controls in real Chrome
        env:
          SCENEOLOGY_SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/test-live-quest-girl-motion-interactions.mjs
      - name: Verify four Quest Girl poses in real Chrome
        env:
          SCENEOLOGY_SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/test-live-quest-girl-motion-clips.mjs
      - name: Verify source-model orbit perspectives in Chrome
        env:
          SCENEOLOGY_SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/test-live-family-orbit.mjs
      - name: Verify partial Reading Corner reconstruction in Chrome
        env:
          SCENEOLOGY_SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/test-live-reading-corner.mjs
      - name: Preserve website verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sceneology-live-pages-evidence
          path: |
            artifacts/live-site/
            artifacts/model-site/
            artifacts/live-family-review/
            artifacts/live-room-review/
            artifacts/live-blanket-review/
            artifacts/live-quest-girl-motion/
            artifacts/live-family-orbit/
            artifacts/live-reading-corner/
          if-no-files-found: warn
          retention-days: 7
