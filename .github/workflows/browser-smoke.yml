name: Browser smoke for archived scene
on:
  push:
    branches: [main]
    paths:
      - 'experiments/backyard-daynight-legacy-webgl2.html'
      - 'experiments/backyard-outline-inverted-hull-rejected.html'
      - 'experiments/backyard-outline-screen-space-v2.html'
      - 'scripts/test-webgl-browser.mjs'
      - '.github/workflows/browser-smoke.yml'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Identify software renderer environment
        run: google-chrome --version
      - name: Exercise three archival WebGL2 viewers
        run: node scripts/test-webgl-browser.mjs
      - name: Preserve render and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archived-webgl2-browser-evidence
          path: artifacts/browser-smoke/
          if-no-files-found: warn
          retention-days: 7
